name: Hourly Visibility Update

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pandas requests
      - env:
          AFCD_FCZ_API_URL: ${{ secrets.AFCD_FCZ_API_URL }}
        run: python main.py
      - run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add live_visibility.csv live_visibility.geojson
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update live visibility [skip ci]" && git push)
